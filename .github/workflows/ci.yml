name: CI
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version/artifact label (leave empty to derive from git describe)'
        required: false
        default: ''
        type: string
      upload-artifact:
        description: 'Upload artifacts to a draft prerelease'
        required: true
        default: true
        type: boolean
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/'
      - 'appcast.xml'
  push:
    branches:
       - main
       - dev
       - v3
       - v4
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/'
      - 'appcast.xml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    permissions: write-all
    if: "${{!contains(github.event.head_commit.message, 'release: version')}}"
    with:
      upload-artifact: ${{ github.event_name == 'workflow_dispatch' && inputs.upload-artifact || github.event_name == 'push' }}
      version: ${{ inputs.version }}
      
